<form id="search-form" onsubmit="return false;">
  <input type="text" id="search__input" placeholder="Search for post titles&hellip;" autocomplete="off">
</form>

<ul id="search-results"></ul>


<script>
  // Wait for the page to load
  window.onload = function() {
    // Get the elements from the page
    const searchInput = document.getElementById('search__input');
    const resultsContainer = document.getElementById('search-results');
    let posts = []; // This will store our post data

    // 1. Fetch the search data
    fetch('/search.json')
      .then(response => response.json())
      .then(data => {
        posts = data; // Store the post data in our 'posts' variable
      })
      .catch(error => console.error('Error fetching search data:', error));

    // 2. Listen for keyboard input in the search box
    searchInput.addEventListener('keyup', function() {
      const query = this.value.toLowerCase().trim(); // Get the search query
      resultsContainer.innerHTML = ''; // Clear previous results

      // If the query is empty, don't show any results
      if (query.length === 0) {
        return;
      }

      // 3. Filter the posts based on the query
      const matchingPosts = posts.filter(post => {
        return post.title.toLowerCase().includes(query);
      });

      // 4. Display the results
      matchingPosts.forEach(post => {
        const listItem = document.createElement('li');
        listItem.innerHTML = `<a href="${post.url}">${post.title}</a> <span style="color: #888;">- ${post.date}</span>`;
        resultsContainer.appendChild(listItem);
      });
    });
  };
</script>
